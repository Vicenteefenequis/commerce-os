services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_os}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    working_dir: /repo/apps/backend
    command: ["pnpm", "run", "migrate:up"]
    environment:
      # Runs as the privileged/owner role (creates tables, roles, RLS policies).
      DATABASE_URL: postgres://${POSTGRES_USER:-commerce_os}:${POSTGRES_PASSWORD:-commerce_os}@postgres:5432/${POSTGRES_DB:-commerce_os}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-commerce_os_app}
      OUTBOX_DB_PASSWORD: ${OUTBOX_DB_PASSWORD:-commerce_os_outbox}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      # Was hardcoded to `production`, silently overriding .env's own
      # NODE_ENV=development default - that also forces `Secure` on the
      # session cookie (cookie.ts), which browsers strip on any http://
      # origin other than localhost (e.g. a phone hitting this over LAN
      # IP), breaking login there even though it works from a desktop
      # browser via localhost. `${NODE_ENV:-development}` respects .env
      # like every other var here; set NODE_ENV=production in .env for a
      # real HTTPS deployment.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Connects as the non-superuser app_user role, so RLS (design.md D4)
      # is actually enforced - superusers and table owners bypass RLS.
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:-commerce_os_app}@postgres:5432/${POSTGRES_DB:-commerce_os}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cos_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # Payments (M3) - Stripe test-mode keys, from .env (never hardcoded here).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Static fallback only - the `stripe-cli` service below keeps the
      # real, current secret in the shared volume file below, since
      # `stripe listen` rotates it on every restart (see
      # stripe-payment-provider.ts's resolveWebhookSecret()).
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_FILE: /shared/stripe-webhook-secret
      # Transactional email (M10) - Resend (if set in .env) still takes
      # priority over SMTP; SMTP_HOST is the mailpit service's in-network
      # hostname, not localhost (backend runs in its own container).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - stripe_webhook_secret:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "dist/worker/outbox-worker.js"]
    environment:
      NODE_ENV: production
      # Dedicated role with cross-tenant SELECT on outbox_events only
      # (design.md D6 / see migration 1700000008000) - the worker must
      # scan pending events across all tenants; app_user cannot.
      DATABASE_URL: postgres://outbox_worker_user:${OUTBOX_DB_PASSWORD:-commerce_os_outbox}@postgres:5432/${POSTGRES_DB:-commerce_os}
      # Transactional email (M10) - the outbox consumer that issues
      # tickets and sends the confirmation email runs in THIS container,
      # not `backend` - it needs its own copy of these vars (see the
      # `backend` service above for the same rationale).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Dev only - forwards Stripe test-mode webhooks to the backend so
  # payments actually settle without a publicly reachable URL. Runs as
  # a real docker-compose service (not a background shell process) so
  # it survives closing whatever terminal/session started the stack,
  # and `restart: unless-stopped` brings it back after a crash or
  # `docker restart`. See scripts/stripe-listen.sh for why the webhook
  # secret it prints is written to a shared file instead of .env.
  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/stripe-listen.sh"]
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FORWARD_TO: http://backend:4000/webhooks/stripe
    volumes:
      # Mounted as a directory, not a single file - single-file bind
      # mounts hit a Docker Desktop/WSL2 bug ("not a directory" on
      # mountpoint creation) that a directory mount avoids.
      - ./scripts:/scripts:ro
      - stripe_webhook_secret:/shared:rw
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      PORT: 3000
    depends_on:
      - backend

volumes:
  postgres_data:
  stripe_webhook_secret:
